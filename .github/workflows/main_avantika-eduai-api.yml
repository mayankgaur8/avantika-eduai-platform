name: Build and deploy Node.js app to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: avantika-interview-api
  AZURE_WEBAPP_URL: https://avantika-interview-api-d0hubeg6exgwbgg3.centralindia-01.azurewebsites.net

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install backend dependencies
        run: npm ci --omit=dev

      - name: Prepare backend artifact
        run: |
          mkdir release
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='client' \
            --exclude='node_modules/.cache' \
            --exclude='.env' \
            --exclude='.env.*' \
            ./ release/

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: release

      - name: Verify publish profile secret is present
        shell: bash
        env:
          PUBLISH_PROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
        run: |
          if [ -z "$PUBLISH_PROFILE" ]; then
            echo "ERROR: GitHub secret AZUREAPPSERVICE_PUBLISHPROFILE is missing or empty."
            echo "Create it in GitHub repo > Settings > Secrets and variables > Actions."
            exit 1
          fi

          if ! echo "$PUBLISH_PROFILE" | grep -q "publishData"; then
            echo "ERROR: AZUREAPPSERVICE_PUBLISHPROFILE does not look like a valid Azure publish profile XML."
            echo "It must contain full XML copied from Azure Download publish profile file."
            exit 1
          fi

          echo "Publish profile secret exists and looks valid."

      - name: Deploy to Azure Web App using publish profile
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: release
