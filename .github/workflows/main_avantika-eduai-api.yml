name: Build and deploy Node.js app to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: avantika-interview-api
  AZURE_WEBAPP_URL: https://avantika-interview-api-d0hubeg6exgwbgg3.centralindia-01.azurewebsites.net
  NODE_VERSION: "18"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Prepare backend artifact
        run: |
          rm -f backend.zip
          zip -r backend.zip src db package.json package-lock.json

      - name: Verify artifact structure
        run: |
          test -f backend.zip
          unzip -l backend.zip | head -50

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-zip
          path: backend.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10

    environment:
      name: Production
      url: https://avantika-interview-api-d0hubeg6exgwbgg3.centralindia-01.azurewebsites.net

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-zip
          path: .

      - name: Verify downloaded package
        run: |
          ls -lah
          test -f backend.zip
          unzip -l backend.zip | head -50

      - name: Verify Azure publish profile secret
        env:
          PUBLISH_PROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
        run: |
          if [ -z "$PUBLISH_PROFILE" ]; then
            echo "ERROR: AZUREAPPSERVICE_PUBLISHPROFILE is missing or empty."
            exit 1
          fi

          if ! echo "$PUBLISH_PROFILE" | grep -q "publishData"; then
            echo "ERROR: Secret does not contain valid Azure publish profile XML."
            echo "Fix: download publish profile from Azure App Service and paste FULL XML into GitHub secret."
            exit 1
          fi

          if ! echo "$PUBLISH_PROFILE" | grep -q "avantika-interview-api"; then
            echo "ERROR: Publish profile is not for avantika-interview-api."
            echo "Fix: download publish profile from the correct Azure App Service."
            exit 1
          fi

          echo "Publish profile secret is present and appears valid."

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: avantika-interview-api
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: backend.zip
