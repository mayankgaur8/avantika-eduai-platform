name: Build and deploy Node.js app to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  # Azure App Service resource name (without the random-suffix hostname segment).
  # Maps to: avantika-interview-api-<hash>.centralindia-01.azurewebsites.net
  AZURE_WEBAPP_NAME: avantika-interview-api
  NODE_VERSION: '20.x'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # We do NOT run npm ci here and do NOT include node_modules in the artifact.
      # Azure App Service (Oryx) runs `npm install` during deployment, which also
      # triggers Puppeteer's postinstall script to download Chrome into
      # PUPPETEER_CACHE_DIR=/home/.cache/puppeteer (persistent Azure storage).
      # This means Chrome survives across deploys without being in the artifact.
      # Required Azure App Setting: SCM_DO_BUILD_DURING_DEPLOYMENT=true

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            src
            db
            package.json
            package-lock.json

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    environment:
      name: Production
      url: https://avantika-interview-api-d0hubeg6exgwbgg3.centralindia-01.azurewebsites.net

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A3A077F26E154EE09A8D382283EDFF07 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4491DDAD130442D9ACE10FF65B75901A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_660D444252454027B943B997403056BA }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: Production
          package: .
