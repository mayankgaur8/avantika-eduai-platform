name: Build and deploy Node.js app to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: avantika-interview-api

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Validate required files
        run: |
          test -f package.json
          test -f package-lock.json
          test -d src

      - name: Install backend dependencies
        run: npm ci --omit=dev

      - name: Create clean deployment package
        run: |
          zip -r backend.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "client/*" \
            -x "node_modules/*" \
            -x ".env" \
            -x ".env.*" \
            -x "*.log" \
            -x ".DS_Store"

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-zip
          path: backend.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: Production
      url: https://avantika-interview-api-d0hubeg6exgwbgg3.centralindia-01.azurewebsites.net

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-zip
          path: .

      - name: Verify publish profile secret exists
        env:
          PUBLISH_PROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
        run: |
          if [ -z "$PUBLISH_PROFILE" ]; then
            echo "AZUREAPPSERVICE_PUBLISHPROFILE is missing or empty"
            exit 1
          fi
          if ! echo "$PUBLISH_PROFILE" | grep -q "publishData"; then
            echo "Invalid publish profile XML"
            exit 1
          fi
          echo "Publish profile secret exists"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: backend.zip
