name: Build and deploy Node.js app to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: avantika-interview-api
  NODE_VERSION: "18"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Prepare backend artifact
        run: |
          rm -f backend.zip
          zip -r backend.zip src db package.json package-lock.json

      - name: Verify artifact
        run: |
          test -f backend.zip
          echo "Size: $(du -sh backend.zip | cut -f1)"
          unzip -l backend.zip | head -20

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-zip
          path: backend.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-zip
          path: .

      - name: Show downloaded files
        run: |
          ls -lah
          unzip -l backend.zip | head -20

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A3A077F26E154EE09A8D382283EDFF07 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4491DDAD130442D9ACE10FF65B75901A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_660D444252454027B943B997403056BA }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: backend.zip
